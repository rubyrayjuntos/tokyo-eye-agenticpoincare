[project]
name = "tokyo-eye-agenticpoincare"
version = "0.1.0"
description = "Hybrid platform for hyperbolic GNNs, DTIE pipelines, and agentic structural biology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Shared across agent and science containers
    "numpy>=1.26,<2",
    "pydantic>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
agent = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.2,<5",
    "matplotlib>=3.8,<4",
]
training = [
    "mlflow>=2.14,<3",
    "optuna>=3.6,<5",
]
science = [
    "torch>=2.3,<3",
    "torch-geometric>=2.5,<3",
    "torch-scatter>=2.1,<3",
    "torch-sparse>=0.6,<1",
    "geoopt>=0.5,<1",
    "e3nn>=0.5,<1",
    "gudhi>=3.10,<4",
    "biotite>=1.0,<2",
    "biopython>=1.84,<2",
    "rdkit>=2024.03",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "scikit-learn-extra>=0.3,<1",
    "hdbscan>=0.8,<0.8.41",
    "openmm>=8.5,<9",
    "pandas>=2.2,<3",
    "networkx>=3.3,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Line length conflicts with formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a real database connection or large checkpoints",
    "governance: property-gate tests enforced in .github/workflows/gates.yml",
]
addopts = "--strict-markers --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true

# Dependency strategy:
# - pyproject.toml defines version ranges (source of truth for what we need)
# - requirements-agent.txt / requirements-science.txt are pinned lockfiles for Docker builds
# - To regenerate lockfiles: uv pip compile pyproject.toml --extra agent -o requirements-agent.txt
#                            uv pip compile pyproject.toml --extra science -o requirements-science.txt
#
# Performance notes:
# - Agent container uses lightweight dependencies only (no PyTorch, RDKit)
# - Science container isolated in separate image with CUDA 12.1 and GPU support
# - Database connection pooling configured via psycopg-pool
# - Local development via 'uv run' for fast iteration and hot-reload
