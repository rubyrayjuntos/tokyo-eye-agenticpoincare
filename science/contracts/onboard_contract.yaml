api_surfaces:
  ModelsResponse:
    fields:
    - contract_version
    - production_model_id
    - models
    - checkpoints
  IngestResponse:
    coordinator:
    - structure_id
    - pdb_id
    - residues
    - residue_count
    - chains
    - chain_count
    - atoms
    - audit_only
    - audit_run_id
    - pipeline_status
    - pipeline_job_id
    - pipeline_status_url
    - readiness_url
    - source
    - already_existed
    science:
    - structure_id
    - chain_count
    - residue_count
    - atom_count
    - computation_scope
    - alignment_status
    - already_existed
    - audit_only
    - audit_run_id
    - onboard_geometric_notes
    - audit_run_id
  HydrateBundle:
    fields:
    - structure_id
    - structure_snapshot
    - embeddings
    - graph_metrics
    - allosteric_sites
    - binding_scan
    - source_leaks
    - hypotheses
    - provenance_runs
    - annotations
    - phase2_vulnerability
    - phase4_resistance
    - phase5_pharmacophore
    - phase6_drug_candidates
    - resistance_data
    - persistence_status
    - context_summary
    - buffering_atlas
    - artifact_availability
    - hydrate_meta
    excludes:
    - readiness
  ReadinessResponse:
    fields:
    - structure_id
    - readiness_status
    - computation_run_id
    - pathway
    - current_act
    - foundation
    - acts
    - artifacts
    - tier1
    - tier2
    - missing_artifacts
    - degraded_reasons
    - probe_errors
    - pipeline_job
    - geometric_readiness
  PipelineJob:
    fields:
    - job_id
    - structure_id
    - status
    - current_step
    - progress
    - modules
    - error
    - started_at
    - completed_at
    status_values:
    - queued
    - running
    - complete
    - failed
    - timed_out
    - skipped
