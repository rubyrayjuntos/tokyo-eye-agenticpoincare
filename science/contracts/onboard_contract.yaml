  AlignmentPayload:
    source: science/dtie/common/ingest_payloads.py
  ComputationScopePayload:
    source: science/dtie/common/ingest_payloads.py
  HyperbolicMotifPayload:
    source: science/dtie/common/normalizer_payloads.py
  PhaseOutputPayload:
    source: science/dtie/common/normalizer_payloads.py
