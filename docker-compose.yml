version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: tokyoeye-db:latest
    container_name: tokyoeye_db
    environment:
      POSTGRES_DB: tokyoeye_dev
      POSTGRES_USER: tokyoeye
      POSTGRES_PASSWORD: tokyoeye_dev_local
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=16MB -c maintenance_work_mem=64MB"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokyoeye -d tokyoeye_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tokyoeye_net
    restart: unless-stopped

  science:
    build:
      context: .
      dockerfile: Dockerfile.science
      cache_from:
        - tokyoeye-science:latest
    image: tokyoeye-science:latest
    container_name: tokyoeye_science
    environment:
      DATABASE_URL: postgresql://tokyoeye:tokyoeye_dev_local@db:5432/tokyoeye_dev
      CHECKPOINT_DIR: /app/checkpoints
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Reduce memory overhead
      OMP_NUM_THREADS: "1"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./checkpoints_v5:/app/checkpoints_v5
      - ./checkpoints_v5_retrained:/app/checkpoints_v5_retrained
      - ./checkpoints_v6:/app/checkpoints_v6
      - ./checkpoints_v6_gumbel:/app/checkpoints_v6_gumbel
      - ./checkpoints_v6_hybrid:/app/checkpoints_v6_hybrid
      - ./checkpoints_v6_topo:/app/checkpoints_v6_topo
      - ./checkpoints_v6_retrained:/app/checkpoints_v6_retrained
      - ./science:/app/science
      - ./agent:/app/agent
      - ./data:/app/data
      - ./shared:/app/shared
      - ./scripts:/app/scripts
      - ./experiments:/app/experiments
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tokyoeye_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      cache_from:
        - tokyoeye-agent:latest
    image: tokyoeye-agent:latest
    container_name: tokyoeye_agent
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tokyoeye:tokyoeye_dev_local@db:5432/tokyoeye_dev
      JWT_SECRET: dev-secret-change-in-production
      REQUIRE_AUTH: "false"
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Uvicorn concurrency tuning
      WEB_CONCURRENCY: "4"
      # Database connection pool (psycopg-pool)
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./agent:/app/agent
      - ./data:/app/data
      - ./shared:/app/shared
      - ./science:/app/science
    networks:
      - tokyoeye_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  tokyoeye_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  wal_archive:
    driver: local
