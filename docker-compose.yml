services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: tokyoeye-db:latest
    container_name: tokyoeye_db
    environment:
      POSTGRES_DB: tokyoeye_dev
      POSTGRES_USER: tokyoeye
      POSTGRES_PASSWORD: tokyoeye_dev_local
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=16MB -c maintenance_work_mem=64MB"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      # Ensure mlflow DB exists (init script only runs on fresh volumes)
      test:
        [
          "CMD-SHELL",
          "psql -U tokyoeye -d tokyoeye_dev -tAc \"SELECT 1 FROM pg_database WHERE datname='mlflow'\" | grep -q 1 || psql -U tokyoeye -d tokyoeye_dev -c \"CREATE DATABASE mlflow OWNER tokyoeye\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tokyoeye_net
    restart: unless-stopped

  science:
    build:
      context: .
      dockerfile: Dockerfile.science
      cache_from:
        - tokyoeye-science:latest
    image: tokyoeye-science:latest
    container_name: tokyoeye_science
    environment:
      DATABASE_URL: postgresql://tokyoeye:tokyoeye_dev_local@db:5432/tokyoeye_dev
      CHECKPOINT_DIR: /app/checkpoints
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_REGISTRY_URI: http://mlflow:5000
      MLFLOW_ALLOW_FILE_STORE: "false"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      MPLCONFIGDIR: /tmp/matplotlib
      GNN_INTERACTIVE_HTML: "true"
      GNN_VIEWER_OUTPUT_DIR: /app/data/local_objects/gnn_viewer
      OMP_NUM_THREADS: "1"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./checkpoints_v5:/app/checkpoints_v5
      - ./checkpoints_v5_retrained:/app/checkpoints_v5_retrained
      - ./checkpoints_v6:/app/checkpoints_v6
      - ./checkpoints_v6_gumbel:/app/checkpoints_v6_gumbel
      - ./checkpoints_v6_hybrid:/app/checkpoints_v6_hybrid
      - ./checkpoints_v6_topo:/app/checkpoints_v6_topo
      - ./checkpoints_v6_retrained:/app/checkpoints_v6_retrained
      - ./science:/app/science
      - ./agent:/app/agent
      - ./data:/app/data
      - ./shared:/app/shared
      - ./scripts:/app/scripts
      - ./experiments:/app/experiments
      - ./manifests:/app/manifests
      - ./mlruns:/app/mlruns
      - ./mlflow-artifacts:/app/mlflow-artifacts
      - ./pdb_cache:/tmp/dtie_pdb_cache
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - tokyoeye_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      cache_from:
        - tokyoeye-agent:latest
    image: tokyoeye-agent:latest
    container_name: tokyoeye_agent
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tokyoeye:tokyoeye_dev_local@db:5432/tokyoeye_dev
      JWT_SECRET: dev-secret-change-in-production
      REQUIRE_AUTH: "false"
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      WEB_CONCURRENCY: "4"
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      GNN_VIEWER_OUTPUT_DIR: /app/data/local_objects/gnn_viewer
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_REGISTRY_URI: http://mlflow:5000
      SCIENCE_API_URL: http://science:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ./agent:/app/agent
      - ./data:/app/data
      - ./shared:/app/shared
      - ./science:/app/science
      - ./checkpoints:/app/checkpoints
      - ./manifests:/app/manifests
      - ./experiments:/app/experiments
    networks:
      - tokyoeye_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.science
      cache_from:
        - tokyoeye-science:latest
    image: tokyoeye-science:latest
    container_name: tokyoeye_mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://tokyoeye:tokyoeye_dev_local@db:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /app/mlflow-artifacts
    command:
      - sh
      - -c
      - |
        mkdir -p /app/mlflow-artifacts
        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri postgresql://tokyoeye:tokyoeye_dev_local@db:5432/mlflow \
          --default-artifact-root /app/mlflow-artifacts \
          --allowed-hosts "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000" \
          --cors-allowed-origins "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,http://127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-artifacts:/app/mlflow-artifacts
      - ./checkpoints:/app/checkpoints
      - ./experiments:/app/experiments
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tokyoeye_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  tokyoeye_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  wal_archive:
    driver: local
