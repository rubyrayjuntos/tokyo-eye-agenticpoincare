# Tokyo Eye PostgreSQL Configuration
# Base: pgvector/pgvector:pg16 defaults + hyperbolic geometry support

# --- Connection ---
listen_addresses = '*'
max_connections = 100

# --- Memory ---
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# --- WAL & Recovery (point-in-time recovery capability) ---
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
max_wal_senders = 3
wal_keep_size = 256MB

# --- Performance ---
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
max_parallel_workers_per_gather = 2

# --- Logging ---
log_min_duration_statement = 500
log_line_prefix = '%t [%p] %u@%d '

# --- Extensions ---
shared_preload_libraries = 'pg_cron,vector'
cron.database_name = 'tokyoeye_dev'

# --- plpython3u ---
# Enabled via CREATE EXTENSION in init script
